[platformio]
# `pio run` is the documented firmware build.  The host-native environment
# below is reserved for `pio test -e native` and requires a host C++ compiler.
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  dfrobot/DFRobot_AI10 @ 1.0.0
  olikraus/U8g2 @ 2.36.18

[env:native]
platform = native
test_build_src = true
# test_security needs mbedTLS sources, which the PIO native environment does
# not provide; those tests build and run through test/native_test_build.sh
# (GCC or MSVC) instead.
test_ignore = test_security
build_src_filter =
  +<guardian_x/device_core.cpp>
  -<main.cpp>
  -<guardian_x/littlefs_storage.cpp>
  -<guardian_x/security.cpp>
